<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Creation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Apply to one of GTL AI's Projects</h1>
    <p>Each project is directed by one of "The Crew's" main members.</p>
  </header>

  <!-- SINGLE MAIN WRAPPER FOR ALL THREE CARDS -->
  <main class="cards-wrapper">    

    <!-- SPLIT CONTAINER 1 -->
    <div class="split-container">
      <div class="box image-box">
        <img src="Gary.jpg" alt="Gary D. Mendez">
        <figcaption>Gary D. Mendez</figcaption>
  </figure>
      </div>
      <div class="box form-box">
        <p class="project-director">Gary D. Mendez</p>
        <form>
          <h2>Sign Up</h2>
          <label for="name-1">Name</label>
          <input type="text" id="name-1" name="name">

          <label for="email-1">Email</label>
          <input type="email" id="email-1" name="email">

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <!-- SPLIT CONTAINER 2 -->
    <div class="split-container">
      <div class="box image-box">
        <img src="rengi.enc" alt="Rengi D. Prime">
        <figcaption>Rengi D. Prime</figcaption>
  </figure>
      </div>
      <div class="box form-box">
        <p class="project-director">Rengi D. Prime</p>
        <form>
          <h2>Sign Up</h2>
          <label for="name-2">Name</label>
          <input type="text" id="name-2" name="name">

          <label for="email-2">Email</label>
          <input type="email" id="email-2" name="email">

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <!-- SPLIT CONTAINER 3 -->
    <div class="split-container">
      <div class="box image-box">
        <img src="chucho.jpg" alt="Jesus D. Garcia">

        <figcaption>Jesus D. Garcia</figcaption>
      </div>
      <div class="box form-box">
        <p class="project-director">Jesus D. Garcia</p>
        <form>
          <h2>Sign Up</h2>
          <label for="name-3">Name</label>
          <input type="text" id="name-3" name="name">

          <label for="email-3">Email</label>
          <input type="email" id="email-3" name="email">

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

  </main>

</body>
</html>
